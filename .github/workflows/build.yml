name: Build installer

# Shared by nightly.yml and release.yml: unsigned NSIS installer (app + driver package; the installer signs the driver
# catalog on the user's PC with sign-catalog.ps1), with a GitHub build-provenance attestation, uploaded as one artifact.
on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: Artifact name; '-<sha7>' is appended
        type: string
        required: true
    outputs:
      artifact:
        description: Name of the uploaded artifact
        value: ${{ jobs.build.outputs.artifact }}
      version:
        description: App version from tauri.conf.json
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
    outputs:
      artifact: ${{ steps.collect.outputs.artifact }}
      version: ${{ steps.collect.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3
      # Installs the version pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # signtool only verifies (smoke test below); nothing in CI signs.
      - name: Put signtool and Inf2Cat on PATH
        run: |
          foreach ($exe in 'x64\signtool.exe', 'x86\Inf2Cat.exe') {
            $f = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\$exe" |
              Sort-Object { $_.VersionInfo.FileVersionRaw } -Descending | Select-Object -First 1
            if (-not $f) { throw "$exe not found under Windows Kits\10\bin" }
            Write-Output "Using $($f.FullName)"
            $f.DirectoryName >> $env:GITHUB_PATH
          }

      - name: Build driver (Release x64)
        run: msbuild driver/openx3d/openx3d.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Package and stage driver
        run: |
          # The catalog stays unsigned until sign-catalog.ps1 runs on the user's PC.
          & driver/scripts/package.ps1 -BuildDir driver/openx3d/x64/Release -OutDir staging/driver
          # CONTRACT §6: hooks.nsh embeds exactly these three from resources/driver/, plus driver/scripts/sign-catalog.ps1.
          $files = 'openx3d.inf', 'openx3d.dll', 'openx3d.cat' | ForEach-Object { "staging/driver/$_" }
          $missing = $files | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "staging/driver is missing: $($missing -join ', ')" }
          Copy-Item $files app/src-tauri/resources/driver

      - run: npm ci
        working-directory: app

      - name: Build NSIS installer
        working-directory: app
        run: npm run tauri -- build --bundles nsis

      # Test on exactly the files the installer ships, under Windows PowerShell 5.1 like the installer.
      - name: Smoke-test local catalog signing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:RUNNER_TEMP\sigtest"
          Copy-Item app/src-tauri/resources/driver $dir -Recurse
          Copy-Item driver/scripts/sign-catalog.ps1 $dir
          & "$dir\sign-catalog.ps1" -Dir $dir
          $subject = 'CN=Open X3D Pro local driver signing (key destroyed)'
          signtool verify /pa /v "$dir\openx3d.cat"
          if ($LASTEXITCODE -ne 0) { throw 'locally signed catalog does not verify' }
          signtool verify /pa /c "$dir\openx3d.cat" "$dir\openx3d.dll"
          if ($LASTEXITCODE -ne 0) { throw 'catalog does not cover openx3d.dll' }
          $trusted = @(Get-ChildItem Cert:\LocalMachine\Root, Cert:\LocalMachine\TrustedPublisher | Where-Object Subject -eq $subject)
          if ($trusted.Count -ne 2) { throw "expected the certificate in Root and TrustedPublisher, found $($trusted.Count)" }
          if (Get-ChildItem Cert:\CurrentUser\My, Cert:\LocalMachine\My | Where-Object Subject -eq $subject) { throw 'private key was not deleted' }
          $c = $trusted[0]
          $bc = $c.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.19' }
          if (-not $bc -or $bc.CertificateAuthority -or -not $bc.Critical) { throw 'certificate is not a critical CA:FALSE end entity' }
          if (($c.EnhancedKeyUsageList.ObjectId -join ',') -ne '1.3.6.1.5.5.7.3.3') { throw "unexpected EKU: $($c.EnhancedKeyUsageList.ObjectId -join ',')" }
          & "$dir\sign-catalog.ps1" -Remove
          if (Get-ChildItem Cert:\LocalMachine\Root, Cert:\LocalMachine\TrustedPublisher | Where-Object Subject -eq $subject) { throw '-Remove left certificates behind' }

      - name: Collect artifact
        id: collect
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          # app/src-tauri is a member of the root workspace, so the bundle lands in the root target dir.
          $target = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).target_directory
          $setup = @(Get-ChildItem "$target\release\bundle\nsis\*-setup.exe")
          if ($setup.Count -ne 1) { throw "expected one NSIS setup exe in $target\release\bundle\nsis, found $($setup.Count)" }
          New-Item -ItemType Directory artifacts -Force | Out-Null
          Copy-Item $setup[0].FullName "artifacts\Open-X3D-Pro_${version}_x64-setup.exe"
          @(
            "Open X3D Pro $version"
            "commit: $env:GITHUB_SHA ($env:GITHUB_REF)"
            "built:  $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss')) UTC"
            "run:    $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content artifacts\BUILD_INFO.txt
          $sums = Get-ChildItem artifacts -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $sums | Set-Content artifacts\SHA256SUMS.txt
          $sums
          "artifact=${env:ARTIFACT_PREFIX}-$($env:GITHUB_SHA.Substring(0, 7))" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.collect.outputs.artifact }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
          # lets "Re-run all jobs" replace the artifact of the earlier attempt
          overwrite: true

  # Separate job so the build's third-party actions, npm scripts and build.rs never hold the OIDC token.
  attest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: artifacts

      # Verify with: gh attestation verify <file> --repo kaysond/open-x3d-pro
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*
