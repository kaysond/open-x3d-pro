name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # tauri/hidapi/windows-sys are cfg(windows) deps; the Linux lane compiles only the logic modules
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test --if-present
      - run: npm run build

  driver-host-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make -C driver/test

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3

      - name: Build driver (Release x64)
        run: msbuild driver/openx3d/openx3d.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: InfVerif
        run: |
          $tools = "${env:ProgramFiles(x86)}\Windows Kits\10\Tools"
          $infverif = Get-ChildItem "$tools\*\x64\infverif.exe", "$tools\x64\infverif.exe" -ErrorAction SilentlyContinue |
            Sort-Object { $_.VersionInfo.FileVersionRaw } -Descending | Select-Object -First 1
          if (-not $infverif) { throw "infverif.exe not found under $tools" }
          Write-Output "Using $($infverif.FullName)"
          # /h = HLK ruleset (what Partner Center attestation enforces). /w (DCH) would reject the
          # Win10 section, which must name mshidumdf/WUDFRd directly because MsHidUmdf.inf only exists on 22000+.
          & $infverif.FullName /v /h driver\openx3d\openx3d.inf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # Release-mode compile of the app (frontend via beforeBuildCommand), no installer.
      - run: npm run tauri -- build --no-bundle
        working-directory: app

      - uses: actions/upload-artifact@v7
        with:
          name: driver-unsigned-${{ github.sha }}
          path: |
            driver/openx3d/x64/Release/openx3d.dll
            driver/openx3d/openx3d.inf
          retention-days: 7
          if-no-files-found: error
