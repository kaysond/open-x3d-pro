name: Release

# Two ways in. "Run workflow" on main with a version: `bump` writes the version files and pushes a tag,
# which starts this workflow again. On a tag (from `bump`, or pushed by hand): check, build, publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release from main, e.g. 0.2.0 or 0.2.0-rc.1
        type: string

permissions:
  contents: read

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # Pushes with a deploy key: it can bypass main's ruleset and, unlike the workflow token, its tag push starts the release run.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Write the version files
        run: |
          set -euo pipefail
          if ! [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version '$VERSION' must look like 1.2.3 or 1.2.3-rc.1"; exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          base=$major.$minor.$patch
          # The driver reports its version as BCD: one byte major, one nibble each for minor and patch.
          if ((major > 255 || minor > 15 || patch > 15)); then
            echo "::error::X3D_DRIVER_VERSION_BCD holds at most 255.15.15"; exit 1
          fi
          bcd=$(printf '0x%02X%X%X' "$major" "$minor" "$patch")

          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          # Cargo.lock; needs the toolchain pinned in rust-toolchain.toml.
          rustup toolchain install
          cargo update --workspace
          (cd app && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          # The INF is checked out with CRLF; [^\r]* keeps the line ending.
          sed -i -E "s|^(DriverVer[[:space:]]*=[[:space:]]*)[^\r]*|\1$(date -u +%m/%d/%Y),$base.0|" driver/openx3d/openx3d.inf
          sed -i -E \
            -e "s/^( FILEVERSION +).*/\1$major,$minor,$patch,0/" \
            -e "s/^( PRODUCTVERSION +).*/\1$major,$minor,$patch,0/" \
            -e "s/(VALUE \"(File|Product)Version\", +)\"[^\"]*\"/\1\"$base.0\"/" \
            driver/openx3d/openx3d.rc
          sed -i -E "s|^(#define X3D_DRIVER_VERSION_BCD ).*|\1$bcd /* $base */|" driver/openx3d/device.h
          git diff --stat

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

  check:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::$env:GITHUB_REF_NAME ($env:GITHUB_SHA) is not on main"
            exit 1
          }

      - name: Check versions match tag
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v'
          $cargo = Get-Content Cargo.toml -Raw
          $inf = Get-Content driver/openx3d/openx3d.inf -Raw
          $rc = Get-Content driver/openx3d/openx3d.rc -Raw
          $h = Get-Content driver/openx3d/device.h -Raw
          $hex = { param($s) [Convert]::ToInt32($s, 16) }
          # @(file, found, expected); DriverVer is numeric a.b.c.d, so compare a.b.c against the tag without any -suffix.
          $checks = @(
            @('app/package.json version', (Get-Content app/package.json -Raw | ConvertFrom-Json).version, $version),
            @('Cargo.toml [workspace.package] version', $(if ($cargo -match '(?s)\[workspace\.package\](.*?)(?=\n\[|$)' -and $Matches[1] -match '(?m)^version\s*=\s*"([^"]+)"') { $Matches[1] }), $version),
            @('driver/openx3d/openx3d.inf DriverVer', $(if ($inf -match 'DriverVer\s*=\s*[^,]+,\s*([\d.]+)') { $Matches[1].Split('.')[0..2] -join '.' }), ($version -split '-')[0]),
            @('driver/openx3d/openx3d.rc ProductVersion', $(if ($rc -match 'VALUE\s+"ProductVersion",\s*"([^"]+)"') { $Matches[1] }), "$(($version -split '-')[0]).0"),
            @('driver/openx3d/device.h X3D_DRIVER_VERSION_BCD', $(if ($h -match 'X3D_DRIVER_VERSION_BCD\s+0x([0-9A-Fa-f]{2})([0-9A-Fa-f])([0-9A-Fa-f])') { "$(& $hex $Matches[1]).$(& $hex $Matches[2]).$(& $hex $Matches[3])" }), ($version -split '-')[0])
          )
          $failed = $false
          foreach ($c in $checks) {
            if ($c[1] -ne $c[2]) {
              Write-Output "::error::$($c[0]) is '$($c[1])' but tag $env:GITHUB_REF_NAME requires '$($c[2])'"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  build:
    needs: check
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      artifact-prefix: open-x3d-pro-release
      sign: true
    secrets:
      SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
      SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Required reviewers are set on this environment in the repository settings.
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: assets

      - name: Write release notes header
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $fence = '```'
          $sums = (Get-Content assets/SHA256SUMS.txt) -join "`n"
          @"
          Open-source replacement for Logitech Gaming Software for the Logitech Extreme 3D Pro joystick.
          The driver runs in user mode (UMDF 2, no kernel code), so **Memory Integrity (HVCI) and Secure Boot can stay on**.

          ### Install

          1. Recommended: uninstall Logitech Gaming Software first.
          2. Download **Open-X3D-Pro_$($env:VERSION)_x64-setup.exe** below and run it (administrator rights needed; it installs the app and, if you tick the box, the driver).
          3. Unplug and replug the joystick, or reboot if the installer asks.

          ### Signing and provenance

          The installer is signed with the project's self-signed certificate, which Windows does not know, so SmartScreen still shows "Windows protected your PC": choose **More info**, then **Run anyway**. Check the download first: compare the signature's certificate with the [fingerprint in the README]($($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)#verifying-a-download), and verify the GitHub build-provenance attestation that every file below has, proving it was built from this tag by this repository's release workflow: ``gh attestation verify <file> --repo $($env:GITHUB_REPOSITORY) --source-ref refs/tags/$($env:GITHUB_REF_NAME) --signer-workflow $($env:GITHUB_REPOSITORY)/.github/workflows/build.yml``. If you tick the box in the installer, the driver is signed on your PC by a certificate created there, whose private key is deleted immediately. Details: [Driver signing]($($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)#driver-signing).

          ### SHA-256

          $fence
          $sums
          $fence
          "@ | Set-Content release-notes.md

      # gh is preinstalled; re-runs replace the assets of an existing release.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $files = (Get-ChildItem assets -File).FullName
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            $pre = if ($env:TAG.StartsWith('v0.') -or $env:TAG.Contains('-')) { @('--prerelease') } else { @() }
            gh release create $env:TAG @files --repo $env:GITHUB_REPOSITORY --verify-tag `
              --title "Open X3D Pro $env:TAG" --notes-file release-notes.md --generate-notes @pre
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
