name: Release

# Two ways in. "Run workflow" on main with a version: `bump` writes the version files and pushes a tag,
# which starts this workflow again. On a tag (from `bump`, or pushed by hand): check, build, publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release from main, e.g. 0.2.0 or 0.2.0-rc.1
        type: string

permissions:
  contents: read

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # Pushes with a deploy key: it can bypass main's ruleset and, unlike the workflow token, its tag push starts the release run.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Write the version files
        run: |
          set -euo pipefail
          if ! [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version '$VERSION' must look like 1.2.3 or 1.2.3-rc.1"; exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          base=$major.$minor.$patch
          # The driver reports its version as BCD: one byte major, one nibble each for minor and patch.
          if ((major > 255 || minor > 15 || patch > 15)); then
            echo "::error::X3D_DRIVER_VERSION_BCD holds at most 255.15.15"; exit 1
          fi
          bcd=$(printf '0x%02X%X%X' "$major" "$minor" "$patch")

          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          # Cargo.lock; needs the toolchain pinned in rust-toolchain.toml.
          rustup toolchain install
          cargo update --workspace
          (cd app && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          # The INF is checked out with CRLF; [^\r]* keeps the line ending.
          sed -i -E "s|^(DriverVer[[:space:]]*=[[:space:]]*)[^\r]*|\1$(date -u +%m/%d/%Y),$base.0|" driver/openx3d/openx3d.inf
          sed -i -E \
            -e "s/^( FILEVERSION +).*/\1$major,$minor,$patch,0/" \
            -e "s/^( PRODUCTVERSION +).*/\1$major,$minor,$patch,0/" \
            -e "s/(VALUE \"(File|Product)Version\", +)\"[^\"]*\"/\1\"$base.0\"/" \
            driver/openx3d/openx3d.rc
          sed -i -E "s|^(#define X3D_DRIVER_VERSION_BCD ).*|\1$bcd /* $base */|" driver/openx3d/device.h
          git diff --stat

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

  check:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - name: Check versions match tag
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          # DriverVer, the RC and the BCD are numeric, so they compare against the tag without any -suffix.
          base=${version%%-*}
          failed=0
          check() { # name found expected
            if [[ $2 != "$3" ]]; then
              echo "::error::$1 is '$2' but tag $GITHUB_REF_NAME requires '$3'"
              failed=1
            fi
          }
          check 'app/package.json version' "$(jq -r .version app/package.json)" "$version"
          check 'Cargo.toml [workspace.package] version' \
            "$(awk -F'"' '/^\[/ { s = /^\[workspace\.package\]/ } s && /^version *=/ { print $2; exit }' Cargo.toml)" "$version"
          check 'driver/openx3d/openx3d.inf DriverVer' \
            "$(sed -nE 's/^DriverVer[[:space:]]*=[^,]*,[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' driver/openx3d/openx3d.inf)" "$base"
          check 'driver/openx3d/openx3d.rc ProductVersion' \
            "$(sed -nE 's/.*VALUE[[:space:]]+"ProductVersion",[[:space:]]*"([^"]+)".*/\1/p' driver/openx3d/openx3d.rc)" "$base.0"
          read -r a b c < <(sed -nE 's/.*X3D_DRIVER_VERSION_BCD[[:space:]]+0x([0-9A-Fa-f]{2})([0-9A-Fa-f])([0-9A-Fa-f]).*/\1 \2 \3/p' driver/openx3d/device.h) || true
          check 'driver/openx3d/device.h X3D_DRIVER_VERSION_BCD' "${a:+$((16#$a)).$((16#$b)).$((16#$c))}" "$base"
          exit $failed

  build:
    needs: check
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      artifact-prefix: open-x3d-pro-release
      sign: true
    secrets:
      SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
      SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Required reviewers are set on this environment in the repository settings.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: assets

      - name: Write release notes header
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          repo_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          cat > release-notes.md <<EOF
          Open-source replacement for Logitech Gaming Software for the Logitech Extreme 3D Pro joystick.
          The driver runs in user mode (UMDF 2, no kernel code), so **Memory Integrity (HVCI) and Secure Boot can stay on**.

          ### Install

          1. Recommended: uninstall Logitech Gaming Software first.
          2. Download **Open-X3D-Pro_${VERSION}_x64-setup.exe** below and run it (administrator rights needed; it installs the app and, if you tick the box, the driver).
          3. Unplug and replug the joystick, or reboot if the installer asks.

          ### Signing and provenance

          The installer is signed with the project's self-signed certificate, which Windows does not know, so SmartScreen still shows "Windows protected your PC": choose **More info**, then **Run anyway**. Check the download first: compare the signature's certificate with the [fingerprint in the README]($repo_url#verifying-a-download), and verify the GitHub build-provenance attestation that every file below has, proving it was built from this tag by this repository's release workflow: \`\`gh attestation verify <file> --repo $GITHUB_REPOSITORY --source-ref refs/tags/$GITHUB_REF_NAME --signer-workflow $GITHUB_REPOSITORY/.github/workflows/build.yml\`\`. If you tick the box in the installer, the driver is signed on your PC by a certificate created there, whose private key is deleted immediately. Details: [Driver signing]($repo_url#driver-signing).

          ### SHA-256

          \`\`\`
          $(cat assets/SHA256SUMS.txt)
          \`\`\`
          EOF

      # Immutable releases lock assets once published, and this action publishes prereleases before uploading, so upload to a draft first.
      - name: Upload to draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Open X3D Pro ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          draft: true
          files: assets/*
          fail_on_unmatched_files: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
