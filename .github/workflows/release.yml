name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require SignPath secrets
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          $missing = 'SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID' | Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) {
            Write-Output "::error::Releases are signed through SignPath, but secret(s) $($missing -join ', ') are not set. Add them under Settings > Secrets and variables > Actions > New repository secret: SIGNPATH_API_TOKEN = API token of the SignPath CI user that submits to release-signing, SIGNPATH_ORGANIZATION_ID = the SignPath organization ID (shown on the signing policy page). Setup: .github/signpath/README.md. Self-signed builds come from the Nightly workflow."
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Check versions match tag
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v'
          $cargo = Get-Content Cargo.toml -Raw
          $inf = Get-Content driver/openx3d/openx3d.inf -Raw
          $rc = Get-Content driver/openx3d/openx3d.rc -Raw
          # @(file, found, expected); DriverVer is numeric a.b.c.d, so compare a.b.c against the tag without any -suffix.
          # The SignPath driver artifact configuration requires the DLL's ProductVersion string to be exactly a.b.c.0.
          $checks = @(
            @('app/src-tauri/tauri.conf.json version', (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version, $version),
            @('app/package.json version', (Get-Content app/package.json -Raw | ConvertFrom-Json).version, $version),
            @('Cargo.toml [workspace.package] version', $(if ($cargo -match '(?s)\[workspace\.package\](.*?)(?=\n\[|$)' -and $Matches[1] -match '(?m)^version\s*=\s*"([^"]+)"') { $Matches[1] }), $version),
            @('driver/openx3d/openx3d.inf DriverVer', $(if ($inf -match 'DriverVer\s*=\s*[^,]+,\s*([\d.]+)') { $Matches[1].Split('.')[0..2] -join '.' }), ($version -split '-')[0]),
            @('driver/openx3d/openx3d.rc ProductVersion', $(if ($rc -match 'VALUE\s+"ProductVersion",\s*"([^"]+)"') { $Matches[1] }), "$(($version -split '-')[0]).0")
          )
          $failed = $false
          foreach ($c in $checks) {
            if ($c[1] -ne $c[2]) {
              Write-Output "::error::$($c[0]) is '$($c[1])' but tag $env:GITHUB_REF_NAME requires '$($c[2])'"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      signing: signpath
      artifact-prefix: open-x3d-pro-release
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: assets

      - name: Write release notes header
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $fence = '```'
          $sums = (Get-Content assets/SHA256SUMS.txt) -join "`n"
          @"
          Open-source replacement for Logitech Gaming Software for the Logitech Extreme 3D Pro joystick.
          The driver runs in user mode (UMDF 2, no kernel code), so **Memory Integrity (HVCI) and Secure Boot can stay on**.

          ### Install

          1. Recommended: uninstall Logitech Gaming Software first.
          2. Download **Open-X3D-Pro_$($env:VERSION)_x64-setup.exe** below and run it (administrator rights needed; it installs the app and the driver).
          3. Unplug and replug the joystick, or reboot if the installer asks.

          Driver only, without the app: extract **openx3d-driver-$($env:VERSION).zip** and run **install.ps1** from an elevated PowerShell.

          ### Code signing policy

          Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org). Details: [Code signing policy]($($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)#code-signing-policy).

          ### SHA-256

          $fence
          $sums
          $fence
          "@ | Set-Content release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: Open X3D Pro ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: assets/*
