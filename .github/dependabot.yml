version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than a week: compromised versions are usually caught by then.
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than a week: compromised versions are usually caught by then.
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    # Skip releases younger than a week: compromised versions are usually caught by then.
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types: [minor, patch]
